name: PR Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  code-review:
    name: Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-sonnet-4-5-20250929"
          show_full_output: true
          prompt: |
            Review ONLY the files and lines changed in this PR. Do not review the entire codebase.
            If the changes are trivial (config tweaks, typo fixes, dependency bumps), say so briefly and move on.

            Analyze the diff from four expert perspectives. For each perspective, only comment if
            there is something meaningful to say about the changes. Skip a perspective entirely if
            the diff has nothing relevant to it.

            Format your review as follows:

            ## Database Expert
            - Schema design, Drizzle ORM usage, query efficiency, migration safety, PostgreSQL best practices (PostGIS, tsvector, jsonb)

            ## Performance Expert
            - Neon/Vercel cost implications, unnecessary DB round-trips, unbounded selects, missing pagination, S3 efficiency, memory usage, caching opportunities
            - Only flag things that would actually cost money or cause latency spikes

            ## TypeScript Expert
            - Type safety, code readability, Express patterns, Zod schemas, module organization
            - Be practical — flag things that hurt readability or type safety, not style preferences

            ## Security Expert
            - Auth/JWT handling, input validation, access control, secrets exposure, OWASP Top 10, rate limiting
            - Flag actual risks with severity (critical/high/medium/low)

            For each finding, prefix it with the perspective name in bold (e.g. **[Database]**, **[Security]**) so it's clear which expert is speaking.
            Keep feedback concise and actionable. Flag real issues, not nitpicks.
