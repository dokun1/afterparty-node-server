name: PR Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  database-review:
    name: Database Expert Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Database Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-5-20250929
          direct_prompt: |
            Review this PR as a database expert. Focus on:
            - Schema design: normalization, appropriate types, sensible defaults
            - Drizzle ORM usage: idiomatic patterns, proper relations
            - Query efficiency: N+1 risks, missing indexes, unnecessary joins
            - Migration safety: backwards-compatible changes, data loss risks
            - PostgreSQL best practices: proper use of PostGIS, tsvector, jsonb
            Keep feedback smooth and simple. Flag real issues, not style nitpicks.
          timeout_minutes: 10

  performance-review:
    name: Performance Expert Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Performance Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-5-20250929
          direct_prompt: |
            Review this PR as a performance and cost expert. Focus on:
            - Neon/Vercel cost implications: connection pooling, cold starts, function duration
            - Unnecessary database round-trips or redundant queries
            - Large payload risks: unbounded selects, missing pagination
            - S3 operations: efficient uploads, presigned URL patterns
            - Memory usage: streaming vs buffering, large array operations
            - Caching opportunities that would meaningfully reduce cost
            Focus on things that would actually cost money or cause latency spikes. Ignore micro-optimizations.
          timeout_minutes: 10

  typescript-review:
    name: TypeScript Expert Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TypeScript Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-5-20250929
          direct_prompt: |
            Review this PR as a TypeScript expert. Focus on:
            - Type safety: proper use of generics, avoiding `any`, narrowing
            - Code readability: clear naming, small functions, obvious control flow
            - Express patterns: proper middleware typing, error propagation
            - Zod schemas: correct validation, useful error messages
            - Module organization: clean imports, minimal coupling
            - Would a new contributor understand this code without extra context?
            Be practical. Flag things that hurt readability or type safety, not personal style preferences.
          timeout_minutes: 10

  security-review:
    name: Security Expert Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Security Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-5-20250929
          direct_prompt: |
            Review this PR as a security expert. Focus on:
            - Auth: JWT handling, token storage, refresh token rotation
            - Input validation: SQL injection via raw queries, XSS in user content
            - Access control: proper role checks, IDOR vulnerabilities
            - Secrets: credentials in code, env var exposure, S3 bucket policies
            - OWASP Top 10: injection, broken auth, sensitive data exposure
            - Rate limiting: abuse vectors, missing limits on sensitive endpoints
            Flag actual risks with severity (critical/high/medium/low). Do not flag theoretical risks that require already-compromised infrastructure.
          timeout_minutes: 10
